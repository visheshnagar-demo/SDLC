steps:
  # 1. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/sales-order-etl-job:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/sales-order-etl-job:latest', '.']

  # 2. Push container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sales-order-etl-job:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sales-order-etl-job:latest']

  # 3. Deploy or update Cloud Run Job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'sales-order-etl-job'
      - '--image=gcr.io/$PROJECT_ID/sales-order-etl-job:latest'
      - '--region=us-central1'
      - '--tasks=1'
      - '--max-retries=3'
      - '--task-timeout=15m'
      - '--set-env-vars=GCP_PROJECT=$PROJECT_ID,BQ_DATASET=analytics,BQ_TABLE=new_sales_orders'

images:
  - 'gcr.io/$PROJECT_ID/sales-order-etl-job:latest'
  - 'gcr.io/$PROJECT_ID/sales-order-etl-job:$COMMIT_SHA'
